name: Build & Release Greeshan Flasher Template

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Greeshan SourceForge Download Link'
        required: true
        default: 'https://sourceforge.net/projects/miui-greeshan-repack/files/HyperOS2/Redmi-13C-air/greeshan.by_Redmi13C_5G_air_OS2.0.208.0.VGQINXM_15.0_99c03.zip/download'
      tag_name:
        description: 'Release Tag Name'
        required: true
        default: 'v1.0-flasher-template'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full tree zip

      - name: Download Greeshan ROM from SourceForge
        run: |
          echo "Downloading Greeshan ROM..."
          aria2c -x 16 -s 16 -k 1M --allow-overwrite=true --follow-metalink=mem -o greeshan.zip "\${{ github.event.inputs.rom_url }}"

      - name: Extract & Build HyperOS4_Port_By_Yash Template
        run: |
          mkdir -p HyperOS4_Port_By_Yash
          
          # Extract everything EXCEPT super.img (keeps boot, dtbo, vbmeta, bin, META-INF, scripts!)
          7z x greeshan.zip -oHyperOS4_Port_By_Yash -xr!super.img -xr!*.br -xr!*.dat
          
          rm -f greeshan.zip

      - name: Generate Release Notes with Exact Tree & Script Codes
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          # 🚀 HyperOS 4 Port Template (Greeshan Exact Structure)
          **Ready-to-use Hybrid Flasher Template (`Fastboot` + `Recovery`).**
          Bas is zip ke `firmware-update/` (images) folder me apna **`super.img`** daalo aur flash karo!

          ## 📁 Exact Folder Structure
```text
EOF

tree -a HyperOS4_Port_By_Yash >> RELEASE_NOTES.md
echo '```' >> RELEASE_NOTES.md
echo "" >> RELEASE_NOTES.md
echo "## 📜 Exact Flasher & Updater Scripts Code" >> RELEASE_NOTES.md

mkdir -p release_assets
cd HyperOS4_Port_By_Yash

for f in $(find . -maxdepth 4 -type f \( -name "*.bat" -o -name "*.sh" -o -name "update-binary" -o -name "updater-script" \)); do
  clean_name=$(basename "$f")
  cp "$f" "../release_assets/$clean_name"
  
  echo "<details><summary><b>📄 $f (Click to view code)</b></summary>" >> ../RELEASE_NOTES.md
  echo "" >> ../RELEASE_NOTES.md
  echo '```sh' >> ../RELEASE_NOTES.md
  cat "\$f" >> ../RELEASE_NOTES.md
  echo "" >> ../RELEASE_NOTES.md
  echo '```' >> ../RELEASE_NOTES.md
  echo "</details>" >> ../RELEASE_NOTES.md
  echo "" >> ../RELEASE_NOTES.md
done

- name: Pack Complete Flasher Template Zip
run: |
cd HyperOS4_Port_By_Yash
zip -r -0 ../release_assets/HyperOS4_Port_By_Yash_Flasher_Template.zip ./*

- name: Upload Directly to GitHub Releases
uses: softprops/action-gh-release@v2
with:
tag_name: ${{ github.event.inputs.tag_name }}
name: "HyperOS 4 Port Flasher Template (${{ github.event.inputs.tag_name }})"
body_path: RELEASE_NOTES.md
files: |
  release_assets/*
draft: false
prerelease: false
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
